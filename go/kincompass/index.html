<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Get Kin Compass</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="canonical" href="https://another1dd.github.io/kincompass/">
  <script src="/go/go.js" data-app-store="https://apps.apple.com/app/apple-store/id6791076115?pt=128995653&amp;mt=8" data-play=""></script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
           background: Canvas; color: CanvasText; }
    main { max-width: 420px; padding: 32px 24px; }
    .icon { border-radius: 22%; }
    h1 { margin: 16px 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; opacity: .8; line-height: 1.5; }
    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .badges img { height: 48px; }
    .more { display: inline-block; margin-top: 24px; font-size: 14px; color: inherit; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/kincompass/assets/icon-192.png" alt="Kin Compass app icon" width="96" height="96">
    <h1>Kin Compass</h1>
    <p>Daily routines and word-for-word scripts for parents of preschoolers with ADHD.</p>
    <div class="badges">
      <a id="ios-cta" href="https://apps.apple.com/app/apple-store/id6791076115?pt=128995653&amp;mt=8&amp;ct=direct"><img src="/kincompass/assets/app-store-badge.svg" alt="Download on the App Store"></a>
      <a id="android-cta" href="#"><img src="/kincompass/assets/google-play-badge.svg" alt="Get it on Google Play"></a>
    </div>
    <p id="android-note" hidden>Android version coming later.</p>
    <a class="more" href="/kincompass/">More about Kin Compass</a>
  </main>
</body>
</html>
