<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Get Bloomelle</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="canonical" href="https://another1dd.github.io/bloomelle/">
  <script src="/go/go.js" data-app-store="https://apps.apple.com/app/apple-store/id6805390003?pt=128995653&amp;mt=8" data-play=""></script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
           background: Canvas; color: CanvasText; }
    main { max-width: 420px; padding: 32px 24px; }
    .icon { border-radius: 22%; }
    h1 { margin: 16px 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; opacity: .8; line-height: 1.5; }
    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .badges img { height: 48px; }
    .more { display: inline-block; margin-top: 24px; font-size: 14px; color: inherit; opacity: .7; }
    .qr { margin-top: 28px; }
    .qr-box { display: inline-block; padding: 12px; background: #fff; border-radius: 12px; }
    .qr-box svg { display: block; width: 160px; height: 160px; }
    .qr p { margin: 10px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/bloomelle/assets/icon-192.png" alt="Bloomelle app icon" width="96" height="96">
    <h1>Bloomelle</h1>
    <p>Plan your week around your cycle: which days may suit workouts, focus, decisions or rest.</p>
    <div class="badges">
      <a id="ios-cta" href="https://apps.apple.com/app/apple-store/id6805390003?pt=128995653&amp;mt=8&amp;ct=direct"><img src="/bloomelle/assets/app-store-badge.svg" alt="Download on the App Store"></a>
      <a id="android-cta" href="#"><img src="/bloomelle/assets/google-play-badge.svg" alt="Get it on Google Play"></a>
    </div>
    <p id="android-note" hidden>Android version coming later.</p>
    <div class="qr" id="qr" hidden>
      <div class="qr-box" id="qr-code"></div>
      <p>Scan with your phone camera to open it in your app store</p>
    </div>
    <a class="more" href="/bloomelle/">More about Bloomelle</a>
  </main>
</body>
</html>
