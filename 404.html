<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Page Not Found — Chepatapa Apps</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/site.css">
  <style>
    @view-transition {
      navigation: auto;
    }
    :root {
      --accent: #9E6B4A;
    }
    @media (prefers-color-scheme: dark) {
:root {
      --accent:#D9A46F;
    }
}
    [data-theme="dark"] {
      --accent: #D9A46F;
    }
    [data-theme="light"] {
      --accent: #9E6B4A;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background 0.2s ease, color 0.2s ease;
    }
    main {
      max-width: 420px;
      padding: 24px;
    }
    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 15px;
      box-shadow: 0 8px 22px var(--shadow);
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .links a.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="site-bar">
    <a class="site-brand" href="/"><img src="/assets/favicon-32x32.png" alt="" width="28" height="28"><span>Chepatapa Apps</span></a>
    <nav class="site-links" aria-label="Site">
      <a href="/about/">About</a>
      <a href="/build-log/">Build Log</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </nav>
  </div>

  <main>
    <img class="brand-mark" src="/assets/favicon-512.png" alt="Chepatapa Apps logo" width="56" height="56">
    <h1>Page not found</h1>
    <p>Whatever you were looking for isn't at this address. Here's everything that is:</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/flare/">Flare</a>
      <a href="/kincompass/">Kin Compass</a>
      <a href="/bloomelle/">Bloomelle</a>
      <a href="/naveli/">Naveli</a>
      <a href="/torquelle/">Torquelle</a>
      <a href="/build-log/">Build Log</a>
    </div>
  </main>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var isDark = (document.documentElement.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
